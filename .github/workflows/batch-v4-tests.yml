name: CloudVision v4 batch checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  batch-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Check syntax
        run: python -m compileall -q cloudvision/batch.py run_batch_v4.py select_v4_samples.py cloudvision/selection.py label_with_ai_fast.py tests/test_batch_v4.py tests/test_selection_v4.py audit_v4_labels.py tests/test_audit_v4_labels.py cloudvision/v4_data.py train_cloudvision_v4.py tests/test_v4_data.py cloudvision/v4_checkpoint.py tests/test_v4_checkpoint.py cloudvision/v4_holdout.py evaluate_v4_holdout.py tests/test_v4_holdout.py
      - name: Run isolated batch tests
        run: python -m unittest discover -s tests -p "test_batch_v4.py" -v
      - name: Run sample-selection tests
        run: python -m unittest discover -s tests -p "test_selection_v4.py" -v
      - name: Run manual-label audit tests
        run: python -m unittest discover -s tests -p "test_audit_v4_labels.py" -v
      - name: Run v4 data isolation tests
        run: python -m unittest discover -s tests -p "test_v4_data.py" -v
      - name: Run v4 dual-checkpoint selection tests
        run: python -m unittest discover -s tests -p "test_v4_checkpoint.py" -v
      - name: Run blinded independent TEST protocol checks
        run: python -m unittest discover -s tests -p "test_v4_holdout.py" -v
