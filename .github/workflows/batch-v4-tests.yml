name: CloudVision unit checks (Linux + Windows)

on:
  pull_request:
  workflow_dispatch:

jobs:
  batch-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Check all Python syntax
        run: python -m compileall -q .
      - name: Run isolated batch tests
        run: python -m unittest discover -s tests -p "test_batch_v4.py" -v
      - name: Run sample-selection tests
        run: python -m unittest discover -s tests -p "test_selection_v4.py" -v
      - name: Run manual-label audit tests
        run: python -m unittest discover -s tests -p "test_audit_v4_labels.py" -v
      - name: Run v4 data isolation tests
        run: python -m unittest discover -s tests -p "test_v4_data.py" -v
      - name: Run v4 dual-checkpoint selection tests
        run: python -m unittest discover -s tests -p "test_v4_checkpoint.py" -v
      - name: Run blinded independent TEST protocol checks
        run: python -m unittest discover -s tests -p "test_v4_holdout.py" -v
      - name: Run offline operator report tests
        run: python -m unittest discover -s tests -p "test_operator_report_v4.py" -v
      - name: Run v5 preflight and holdout isolation tests
        run: python -m unittest discover -s tests -p "test_v5_preflight.py" -v
      - name: Run competition report integrity tests
        run: python -m unittest discover -s tests -p "test_competition_report.py" -v
      - name: Run targeted cloud-heavy challenge tests
        run: python -m unittest discover -s tests -p "test_cloud_heavy_challenge.py" -v
      - name: Run cloud-heavy case locator tests
        run: python -m unittest discover -s tests -p "test_find_cloud_heavy_case.py" -v
      - name: Run frozen four-panel v4/v5 diagnostic tests
        run: python -m unittest discover -s tests -p "test_compare_cloud_heavy_models.py" -v
      - name: Verify inference safety boundary after refactor
        run: python -m unittest discover -s tests -p "test_inference_boundary.py" -v
      - name: Test strict 75 percent rule
        run: python -m unittest discover -s tests -p "test_rules.py" -v

  source-backup:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gpu-batch-resume'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package tracked source and Git commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git archive --format=zip --output=backup/cloudvision_source_snapshot.zip HEAD
          git bundle create backup/cloudvision_git_history.bundle HEAD
          git bundle verify backup/cloudvision_git_history.bundle
          (cd backup && sha256sum cloudvision_source_snapshot.zip cloudvision_git_history.bundle > SHA256SUMS.txt)
          {
            echo "CloudVision AI source-only backup"
            echo "Branch: feature/gpu-batch-resume"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Generated from committed GitHub files only."
            echo "Does not contain local original images, verified masks, models or reports."
          } > backup/BACKUP_INFO.txt
      - name: Publish downloadable source backup
        uses: actions/upload-artifact@v4
        with:
          name: CloudVision_AI_Source_Backup
          path: backup/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
