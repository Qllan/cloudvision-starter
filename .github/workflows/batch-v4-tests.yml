name: CloudVision v4 batch checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  batch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Check syntax
        run: python -m compileall -q cloudvision/batch.py run_batch_v4.py label_with_ai_fast.py tests/test_batch_v4.py
      - name: Run isolated batch tests
        run: python -m unittest discover -s tests -p "test_batch_v4.py" -v
